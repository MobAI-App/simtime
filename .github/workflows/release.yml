name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0). Must already exist."
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve version
        id: ver
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build CLI (release, arm64)
        run: |
          swift build -c release --arch arm64

      - name: Build runtime dylib
        run: |
          cd Runtime && make

      - name: Stage release artifacts
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          STAGE="simtime-v${VERSION}-macos-arm64"
          mkdir -p "dist/${STAGE}"
          cp .build/arm64-apple-macosx/release/simtime "dist/${STAGE}/simtime"
          cp Runtime/libsimtime.dylib "dist/${STAGE}/libsimtime.dylib"
          cp README.md LICENSE "dist/${STAGE}/"
          chmod +x "dist/${STAGE}/simtime"
          cd dist
          tar -czf "${STAGE}.tar.gz" "${STAGE}"
          shasum -a 256 "${STAGE}.tar.gz" > "${STAGE}.tar.gz.sha256"
          ls -la

      - name: Create / update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes \
              dist/*.tar.gz dist/*.sha256
          else
            gh release upload "$TAG" dist/*.tar.gz dist/*.sha256 --clobber
          fi
